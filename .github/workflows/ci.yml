name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "0 15 * * 2"   # Tuesdays, so the current-season leaderboard stays fresh
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: make lint
      - run: make test

  analysis:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: make refresh
      - run: make analysis
      - run: make test
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: reports/
